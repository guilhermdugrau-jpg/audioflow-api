services:
  - type: web
    name: audioflow-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./server/Dockerfile
    envVars:
      - key: AUDIOFLOW_ENABLE_CONVERT
        value: "1"
      - key: AUDIOFLOW_DISABLE_FFMPEG
        value: "0"
      - key: AUDIOFLOW_MAX_TRACKS
        value: "50"
      - key: AUDIOFLOW_JOBS_PER_HOUR
        value: "0"
      - key: AUDIOFLOW_MAX_CONCURRENT
        value: "1"
      - key: AUDIOFLOW_MAX_QUEUE
        value: "10"
      - key: AUDIOFLOW_FILE_TTL_MIN
        value: "3"
      - key: AUDIOFLOW_MAX_SESSIONS
        value: "500"
      - key: AUDIOFLOW_ALLOWED_ORIGINS
        value: "*"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
    autoDeploy: true